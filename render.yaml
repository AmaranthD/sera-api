services:
  - type: web
    name: sera-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://zcvnfxelcgcydopcdayc.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.8"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: CORS_ORIGINS
        sync: false
      # Só o projeto sera-chat e seus previews; antes qualquer *.pages.dev
      # passava. Para domínio próprio, defina CORS_ORIGINS exato no painel.
      - key: CORS_ORIGIN_REGEX
        value: '^https://([a-z0-9-]+\.)?sera-chat\.pages\.dev$'
      - key: SERA_MAX_TRECHOS
        value: "3"
      - key: SERA_MAX_CHARS_CONTEXTO
        value: "6000"
      - key: BUSCA_HABILITADA
        value: "true"
      - key: BUSCA_PROVEDOR
        value: tavily
      - key: BUSCA_MAX_RESULTADOS
        value: "5"
      - key: BUSCA_TIMEOUT
        value: "15"
      - key: BUSCA_CACHE_TTL
        value: "600"
      - key: BUSCA_PAIS
        value: BR
      - key: BUSCA_MAX_RODADAS
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      - key: SERA_FUSO
        value: America/Sao_Paulo
      - key: SERA_APRENDIZADO
        value: "true"
      # Agenda + Web Push. Gere as chaves com:
      #   python -c "from py_vapid import Vapid; ..."
      # (veja docs/agenda-e-notificacoes.md). Sem elas a agenda funciona,
      # mas as notificações ficam desligadas.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contato@sera.local
      - key: NOTIFICACOES_SEGREDO
        sync: false
      - key: NOTIFICACOES_INTERVALO
        value: "60"
      - key: NOTIFICACOES_PREVIEW
        value: "false"
      # Voz neural (Edge-TTS). O front só envia texto quando a pessoa ativa
      # "Neural" e aceita o aviso de privacidade.
      - key: TTS_HABILITADO
        value: "true"
      - key: TTS_VOZ
        value: pt-BR-FranciscaNeural
      - key: TTS_RATE
        value: "+0%"
      - key: TTS_PITCH
        value: "+0Hz"
      # Necessária para o disparo agendado ler a agenda de todas as pessoas
      # (o caminho normal usa o JWT do usuário e o RLS).
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Opcional: serviço separado em jw-mcp/README.md. Sem a URL/chave, a
      # ferramenta JW fica desligada.
      - key: JW_API_URL
        sync: false
      - key: JW_API_KEY
        sync: false
      - key: JW_MAX_RODADAS
        value: "2"
      # Opcional: lista fechada de e-mails. Descomente e preencha para
      # impedir que qualquer conta autenticada use a API.
      # - key: SERA_EMAILS
      #   sync: false

  # Serviço JW (Bíblia e publicações). Fica no mesmo workspace e divide as
  # 750 h/mês dos serviços free: os dois dormem após 15 min sem tráfego, e
  # dormindo não consomem horas. Não coloque keep-alive nos dois.
  #
  # Depois do primeiro deploy, copie a URL pública (ex.:
  # https://sera-jw-xxxx.onrender.com) para MCP_BASE_URL e para JW_API_URL
  # do sera-api (acrescentando /api no fim).
  - type: web
    name: sera-jw
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./jw-mcp/Dockerfile
    dockerContext: ./jw-mcp
    healthCheckPath: /health
    # O jw-mcp muda raramente. Sem autoDeploy, um push na API não reinicia
    # o JW (e não derruba quem está usando o modo JW no meio).
    autoDeploy: false
    envVars:
      - key: MCP_BASE_URL
        sync: false
      - key: MCP_AUTH_SECRET
        sync: false
      - key: JW_API_KEY
        sync: false
      - key: MCP_TRUST_PROXY
        value: "true"
      - key: MCP_AUTH
        value: "true"
      - key: AUTH_STORE_PATH
        value: /tmp/jw-mcp-auth.json
