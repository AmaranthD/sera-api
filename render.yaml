services:
  - type: web
    name: sera-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://zcvnfxelcgcydopcdayc.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.8"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.pages\\.dev"
      - key: SERA_MAX_TRECHOS
        value: "3"
      - key: SERA_MAX_CHARS_CONTEXTO
        value: "6000"
      - key: BUSCA_HABILITADA
        value: "true"
      - key: BUSCA_PROVEDOR
        value: tavily
      - key: BUSCA_MAX_RESULTADOS
        value: "5"
      - key: BUSCA_TIMEOUT
        value: "15"
      - key: BUSCA_CACHE_TTL
        value: "600"
      - key: BUSCA_PAIS
        value: BR
        value: pt
      - key: BUSCA_MAX_RODADAS
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      # Opcional: lista fechada de e-mails. Descomente e preencha para
      # impedir que qualquer conta autenticada use a API.
      # - key: SERA_EMAILS
      #   sync: false
