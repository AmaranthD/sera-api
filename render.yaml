services:
  - type: web
    name: sera-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://zcvnfxelcgcydopcdayc.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.8"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.pages\\.dev"
      - key: SERA_MAX_TRECHOS
        value: "3"
      - key: SERA_MAX_CHARS_CONTEXTO
        value: "6000"
      - key: BUSCA_HABILITADA
        value: "true"
      - key: BUSCA_PROVEDOR
        value: tavily
      - key: BUSCA_MAX_RESULTADOS
        value: "5"
      - key: BUSCA_TIMEOUT
        value: "15"
      - key: BUSCA_CACHE_TTL
        value: "600"
      - key: BUSCA_PAIS
        value: BR
      - key: BUSCA_MAX_RODADAS
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      - key: SERA_FUSO
        value: America/Sao_Paulo
      - key: SERA_APRENDIZADO
        value: "true"
      # Opcional: serviço separado em jw-mcp/README.md. Sem a URL/chave, a
      # ferramenta JW fica desligada.
      - key: JW_API_URL
        sync: false
      - key: JW_API_KEY
        sync: false
      - key: JW_MAX_RODADAS
        value: "2"
      # Opcional: lista fechada de e-mails. Descomente e preencha para
      # impedir que qualquer conta autenticada use a API.
      # - key: SERA_EMAILS
      #   sync: false

  # Serviço JW (Bíblia e publicações). Fica no mesmo workspace e divide as
  # 750 h/mês dos serviços free: os dois dormem após 15 min sem tráfego, e
  # dormindo não consomem horas. Não coloque keep-alive nos dois.
  #
  # Depois do primeiro deploy, copie a URL pública (ex.:
  # https://sera-jw-xxxx.onrender.com) para MCP_BASE_URL e para JW_API_URL
  # do sera-api (acrescentando /api no fim).
  - type: web
    name: sera-jw
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./jw-mcp/Dockerfile
    dockerContext: ./jw-mcp
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MCP_BASE_URL
        sync: false
      - key: MCP_AUTH_SECRET
        sync: false
      - key: JW_API_KEY
        sync: false
      - key: MCP_TRUST_PROXY
        value: "true"
      - key: MCP_AUTH
        value: "true"
      - key: AUTH_STORE_PATH
        value: /tmp/jw-mcp-auth.json
