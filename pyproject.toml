[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sera"
version = "0.1.0"
description = "Montador de system prompt a partir do personality.yaml"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anyio>=4.0",
    "google-genai>=2.0",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["sera", "sera.api", "sera.prompt", "sera.rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
